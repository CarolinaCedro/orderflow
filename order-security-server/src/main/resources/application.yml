spring:
  application:
    name: order-security-server

  data:
    mongodb:
      uri: mongodb://root:products@localhost:27018/orderflow?authSource=admin

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 9999

security:
  jwt:
    expiration: 3600
